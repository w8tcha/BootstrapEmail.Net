name: release

on:
  workflow_run:
    workflows: ["build dotnet"]
    types:
      - completed
    branches:
      - main

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Get version from csproj
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 -oE '<Version>[^<]+</Version>' BootstrapEmailNet/BootstrapEmail.Net.csproj | sed -E 's/<\/?Version>//g')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: check_tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet build BootstrapEmailNet/BootstrapEmail.Net.csproj -c Release

      - name: Build CLI
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet build BootstrapEmailNet.Cli/BootstrapEmail.Net.Cli.csproj -c Release

      - name: Pack
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet pack BootstrapEmailNet/BootstrapEmail.Net.csproj -c Release -o artifacts

      - name: Pack CLI
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet pack BootstrapEmailNet.Cli/BootstrapEmail.Net.Cli.csproj -c Release -o artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: NuGet login (OIDC -> temporary API key)
        if: steps.check_tag.outputs.exists == 'false'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        if: steps.check_tag.outputs.exists == 'false'
        shell: bash
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Build release notes from commits
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          # Commits since the last release tag (tags are fetched, checkout uses fetch-depth: 0)
          $previousTag = git describe --tags --abbrev=0 2>$null
          $range = if ($previousTag) { "$previousTag..HEAD" } else { "HEAD" }
          Write-Host "Commit range: $range"

          # Subject lines without merge commits and without dependabot updates
          $commits = git log $range --no-merges --pretty=format:"%an%x09- %s (%h)" |
            Where-Object { $_ -and ($_.Split("`t")[0] -notmatch 'dependabot') } |
            ForEach-Object { $_.Split("`t", 2)[1] }

          $notes = "## Changes`n`n"
          $notes += if ($commits) { ($commits -join "`n") } else { "- No changes" }
          $notes += "`n"

          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Get-Content release-notes.md

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" artifacts/*.nupkg --title "v${{ steps.version.outputs.version }}" --notes-file release-notes.md --generate-notes
